KlarCam="KlarCam"
Bypass="A/B: show the original"
Bypass.Desc="The camera frame goes out unchanged; scopes and measurement keep running on the processed frame."
Preset="Preset"
Preset.Desc="Applies the look once; the beard weight, the measurement and the locks stay."
Preset.Keep="(keep the current values)"
Preset.Natural="Natural: light smoothing, crisp edges, a touch of tone correction"
Preset.Stream="Stream: the tuned look (relight, tone, LUTs)"
LicenseKey="License key"
LicenseKey.Desc="Paste it once; it is stored for the app and OBS."
Licensed="Licensed to"
TrialDays="Trial: %d days left, then the filter passes the video through. One-time purchase at klarcam.com"
TrialOver="Trial over: the filter passes the video through until a key is entered (klarcam.com)."
FrameGroup="Framing"
AutoFrame="Auto frame"
AutoFrame.Desc="Crops the camera frame around your face and scales it up, so a far-away face is framed like a close one (the person mask gets finer too). Measured once over a second, then locked and eased in; it never follows your head. Re-framed only after you have sat outside the frame's middle, or much closer or farther, for two seconds. Up to 2x."
FrameTarget="Face height (share of frame)"
FrameTarget.Desc="The face box height as a share of the frame height; 0.41 = a well-framed talking head."
Frame="Frame"
Frame.Measuring="measuring (about a second; reopen the properties to see the result)"
Frame.Locked="locked"
FrameReframe="Reframe"
FrameReframe.Desc="Measures the frame anew (after moving the camera or the chair). Eased over, never jumped."
LightingGroup="Lighting"
Exposure="Exposure (EV)"
Exposure.Desc="The whole frame, first in the chain, like ISO / exposure compensation: gain in linear light with a soft shoulder."
AutoExposure="Automatic: hold the face level"
AutoExposure.Desc="Exposes the whole frame so that the face's p90 holds the target; measured on the face skin, slow near the target, fast while far off, frozen without a face and while the head moves fast. Starts from the exposure slider's value and hands its own back when switched off, so nothing jumps. Switch the camera's own auto exposure off while it runs."
AutoTarget="Face target p90 (IRE)"
FaceLight="Face light (EV)"
FaceLight.Desc="A soft light on your face that fades out with the distance from it: full on the face, less on the neck and the shoulders, none from the reach on. Like a lamp close to your face; no mask, so no silhouette edge. With the automatic on, your face stays at its target and the light darkens everything else relative to it."
FaceLightReach="Face light reach (face widths)"
FaceLightReach.Desc="Where the face light has faded out, in face widths from the face's center: 1.2 = the head alone, 2 = down to the collar, 3 = the shoulders too."
Background="Background vs. you (EV)"
Background.Desc="Everything outside your silhouette, relative to you: negative darkens the room and separates you from the wall, positive also lifts the wall's noise. Stay within about half a stop and light the wall for the rest."
BackgroundRadial="Background falloff"
BackgroundRadial.Desc="0 = the same EV everywhere outside you; 1 = none next to the head, full beyond two face widths."
KeyLight="Key light: a virtual key shaded along your face's 3D shape (the lit side brighter, the shadow side darker, no net gain)"
SkinGroup="Skin"
Smoothing="Smoothing"
Sharpen="Sharpen (edges)"
Sharpen.Desc="Edge-gated high-pass sharpening of the face. Webcams sharpen in-camera already: 0.2-0.3 is plenty there."
Radius="Smoothing radius (px)"
SkinGate="Skin tone detection"
SkinGate.Desc="How strictly the smoothing is gated by the skin tone."
Beard="Beard (keep stubble)"
Beard.Desc="Keeps the lower face below the cheek line out of the smoothing and the skin statistics, so stubble stays stubble."
BeardAuto="Detect the beard automatically"
BeardAuto.Desc="The slider is then the strength for what is detected (the lower face's texture against the cheeks')."
BeardDetected="Beard detected"
ToneGroup="Skin tone (vectorscope)"
ToneSmooth="Correction to skin line"
ToneSmooth.Desc="Rotates outlying skin colors toward the vectorscope skin-tone line."
ToneBand="Tolerance (band width)"
ToneContrast="Saturation contrast"
ToneContrast.Desc="Saturation contrast along the skin line: negative evens the face's saturation, positive spreads it."
SkinPull="Pull to skin line"
SkinPull.Desc="Rotates all skin colors so the face's hue moves toward the band center; 0 = camera, 1 = on the line."
SkinBandLo="Skin band from (deg)"
SkinBandLo.Desc="Skin band as Rec.709 Cb/Cr angles: the scope's sector, the target of the correction and the report's judgement."
SkinBandHi="Skin band to (deg)"
EyeGroup="Eyes and teeth"
EyeSharpen="Eye sharpen"
EyeZone="Eye zone"
EyeZone.Desc="How far the eye sharpening reaches beyond the lid: 1.4 = a crisp ring around the eyes, 1.05 = lids and lashes only."
EyeDereflect="Remove eye reflections"
EyeDereflect.Desc="Removes the key light's catchlights in the eyes."
EyeBrighten="Eye brightening (whites)"
Teeth="Teeth whitening"
Relight="Key light strength"
RelightDir="Light direction"
RelightDir.Desc="Left .. right; with the automatic on, only how far to the measured side."
RelightAuto="Follow the room's light (side)"
RelightAuto.Desc="The key goes to the side your room's light comes from, measured on your face once (a few seconds) and then locked, so it never changes sides during a stream. Off: the slider's sign is the side. A key opposite to the room's light flattens the face."
RoomLight="Room light"
RoomLight.Measuring="measuring (a few seconds; reopen the properties to see the result)"
RoomLight.Right="from the right, locked"
RoomLight.Left="from the left, locked"
RoomLight.Frontal="frontal, locked (the slider's sign is the side)"
RelightMeasure="Measure again"
RelightMeasure.Desc="Measures the room's light anew over a few seconds (after moving a lamp or the desk). The key swings over to the result once and stays there."
RelightSwap="Swap side"
RelightSwap.Desc="Puts the key on the other side if you like that better. Stays until you measure again or switch the automatic off."
RelightHeight="Light height"
RelightHeight.Desc="side .. above"
RelightSpread="Spread (beyond the face)"
RelightEdge="Edge tightness"
RelightEdge.Desc="How tightly the light is cropped to the silhouette."
Film="Film look (grade)"
LutGroup="Color LUTs"
LutRed="Reduce red skin"
LutYellow="Reduce yellow skin"
LutContrast="Contrast look"
LutCustom="Custom LUT"
LutCustomFile="Custom LUT file (.cube)"
LutRegion="Applies to"
LutRegion.Desc="Face skin: the face mask. Person: the silhouette from the segmentation (face always included). Whole frame: like an OBS LUT filter."
LutRegion.Skin="Face skin"
LutRegion.Person="Person (face, neck, hair)"
LutRegion.Frame="Whole frame"
LutInfo="Applied exactly as OBS's Apply LUT filter does (in linear light), in the order contrast look, red, yellow, custom. 'Whole frame' with the same amounts gives the OBS result; 'Person' keeps the background out of it."
